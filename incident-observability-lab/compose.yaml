name: incident-observability-lab
services:
  checkout:
    build: .
    environment:
      OTLP_TRACES_URL: http://jaeger:4318/v1/traces
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - '127.0.0.1:18080:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [lab]
  prometheus:
    image: prom/prometheus:v3.13.4
    ports:
      - '127.0.0.1:19090:9090'
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      checkout:
        condition: service_healthy
    networks: [lab]
  loki-volume-init:
    image: python:3.14-slim
    user: '0:0'
    entrypoint: [python, -c, "import os; os.chown('/loki', 10001, 10001)"]
    volumes: [loki-data:/loki]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ['no-new-privileges:true']
    pids_limit: 16
    mem_limit: 32m
    network_mode: none
  loki:
    image: grafana/loki:3.7.0
    user: '10001:10001'
    ports: ['127.0.0.1:13100:3100']
    command: ['-config.file=/etc/loki/lab.yaml']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    volumes:
      - ./loki.yml:/etc/loki/lab.yaml:ro
      - loki-data:/loki
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      loki-volume-init:
        condition: service_completed_successfully
    networks: [lab]

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    user: '10001:10001'
    ports: ['127.0.0.1:16686:16686']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    networks: [lab]

networks:
  lab:
    driver: bridge
volumes:
  prometheus-data:
  loki-data:
