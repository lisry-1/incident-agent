apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-executor
  namespace: demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-executor
  namespace: demo
rules:
  - apiGroups: ['']
    resources: [pods]
    resourceNames: [checkout-k8s]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods/exec]
    resourceNames: [checkout-k8s]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-executor
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: incident-executor
    namespace: demo
roleRef:
  kind: Role
  name: incident-executor
  apiGroup: rbac.authorization.k8s.io
