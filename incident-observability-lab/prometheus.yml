global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: checkout-lab
    scrape_timeout: 3s
    static_configs:
      - targets: ['checkout:8080']
        labels:
          service: checkout-api
          namespace: demo

  - job_name: checkout-k8s-lab
    scrape_timeout: 3s
    static_configs:
      - targets: ['incident-lab-control-plane:30080']
        labels:
          service: checkout-api
          namespace: demo
